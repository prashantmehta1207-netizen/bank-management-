<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions - Digital Bank</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header class="topbar">
            <a class="brand" href="index.html">
                <span class="brand-icon"><i class="fas fa-university"></i></span>
                <span>
                    <h1>Digital Bank</h1>
                    <p>Deposits and withdrawals</p>
                </span>
            </a>
            <nav class="nav">
                <a href="index.html">Dashboard</a>
                <a href="create.html">Create Account</a>
                <a href="accounts.html">Accounts</a>
                <a class="active" href="transactions.html">Transactions</a>
            </nav>
        </header>

        <main class="panel">
            <div class="page-title">
                <h2>New Transaction</h2>
                <p>Select an account and enter the amount.</p>
            </div>

            <div id="message" class="notice hide"></div>

            <form id="transactionForm" class="form-grid" novalidate>
                <div class="form-group full">
                    <label for="accountNo">Account</label>
                    <select id="accountNo" name="accountNo" required></select>
                </div>

                <div class="form-group">
                    <label for="type">Transaction Type</label>
                    <select id="type" name="type" required>
                        <option value="deposit">Deposit</option>
                        <option value="withdraw">Withdraw</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input id="amount" name="amount" type="number" min="0.01" step="0.01" placeholder="500.00" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn"><i class="fas fa-money-bill-transfer"></i> Save Transaction</button>
                    <a href="accounts.html" class="btn btn-outline"><i class="fas fa-list"></i> Accounts</a>
                </div>
            </form>

            <div class="page-title" style="margin-top: 32px;">
                <h2>Recent Transactions</h2>
                <p>Latest activity appears first.</p>
            </div>
            <div id="transactionsTable"></div>
        </main>
    </div>

    <script src="app.js"></script>
    <script>
        BankApp.renderTransactionsPage();
    </script>
</body>

</html>
